
<div class="container">
<h2>Ethical AI Assessment</h2>
<form method="post">
{% for i in range(1,10) %}
<p>Question {{i}}: Do you follow ethical practices in this area?</p>
<input type="radio" name="q{{i}}" value="yes"> Yes
<input type="radio" name="q{{i}}" value="no"> No
{% endfor %}
<button>Submit</button>
</form>
{% if feedback %}<p>{{feedback}}</p>{% endif %}
<a href="/idea"><button>Next</button></a>
</div>
